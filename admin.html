<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>🛠️ Astrologer Dashboard (Admin)</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121214; color: #fff; padding: 20px; }
        .admin-box { max-width: 800px; margin: 0 auto; }
        .card { background: #1c1c1e; border: 1px solid #333; padding: 20px; margin-bottom: 20px; border-radius: 8px; position: relative; }
        textarea { width: 100%; padding: 10px; background: #121214; color: #fff; border: 1px solid #444; border-radius: 5px; margin: 10px 0; box-sizing: border-box; }
        button { background: #28a745; color: #fff; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 5px; }
        .status { float: right; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .pending { background: #dc3545; }
        .answered { background: #28a745; }
        .btn-delete { background: #dc3545; padding: 5px 10px; font-size: 12px; float: right; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="admin-box" id="adminContent" style="display:none;">
        <h1 style="color: #28a745; border-bottom: 2px solid #28a745; padding-bottom: 10px;">🛠️ Acharya Ji Ka Secret Dashboard (Local)</h1>
        <h3>User Requests:</h3>
        <div id="allRequests">Loading requests...</div>
    </div>

    <script>
        // SIMPLE LOGIN GUARD
        const password = prompt("Admin Password Dalein:");
        if (password === "Astro@123") { // Aap password badal sakte hain
            document.getElementById('adminContent').style.display = "block";
            loadAdminData();
        } else {
            alert("Galat Password! Access Denied.");
            document.body.innerHTML = "<h2 style='text-align:center;color:red;margin-top:100px;'>Unauthorised Access!</h2>";
        }

        // Data load karne ka function
        function loadAdminData() {
            const reqDiv = document.getElementById('allRequests');
            let allRequests = JSON.parse(localStorage.getItem('localAstroRequests')) || [];
            
            reqDiv.innerHTML = "";

            if (allRequests.length === 0) {
                reqDiv.innerHTML = "<p style='color:#aaa;'>Abhi tak koi request nahi aayi hai.</p>";
                return;
            }

            // Ulte kram (Newest First) me dikhane ke liye reverse kiya
            allRequests.slice().reverse().forEach((data) => {
                const statusClass = data.status === "Answered" ? "status answered" : "status pending";

                reqDiv.innerHTML += `
                    <div class="card">
                        <span class="${statusClass}">${data.status}</span>
                        <h3>👤 ${data.name}</h3>
                        <p><strong>📅 DOB:</strong> ${data.dob} | <strong>⏰ Time:</strong> ${data.tob} | <strong>📍 Place:</strong> ${data.pob}</p>
                        <p style="background:#121214; padding:10px; border-left:3px solid #ff6b81;"><strong>❓ Sawaal:</strong> ${data.question}</p>
                        <p style="font-size:13px; color:#ffc107;">🔑 Token ID (User ka token): <strong>${data.id}</strong></p>
                        
                        <textarea id="reply-${data.id}" rows="3" placeholder="Yahan apna kathan aur upay likhein...">${data.reply || ''}</textarea>
                        <button onclick="submitReply('${data.id}')">Reply Save Karein ✓</button>
                        <button class="btn-delete" onclick="deleteRequest('${data.id}')">Delete</button>
                        <div style="clear:both;"></div>
                    </div>
                `;
            });
        }

        // Reply save karne ke liye
        function submitReply(id) {
            const replyText = document.getElementById(`reply-${id}`).value;
            if(!replyText.trim()) { alert("Kripya reply box me kuch likhein!"); return; }

            let allRequests = JSON.parse(localStorage.getItem('localAstroRequests')) || [];
            
            allRequests = allRequests.map(req => {
                if (req.id === id) {
                    req.reply = replyText;
                    req.status = "Answered";
                }
                return req;
            });

            localStorage.setItem('localAstroRequests', JSON.stringify(allRequests));
            alert("Reply kamyabi se save ho gaya!");
            loadAdminData(); // Page refresh bina data reload
        }

        // Request delete karne ke liye
        function deleteRequest(id) {
            if(confirm("Kya aap is request ko delete karna chahte hain?")) {
                let allRequests = JSON.parse(localStorage.getItem('localAstroRequests')) || [];
                allRequests = allRequests.filter(req => req.id !== id);
                localStorage.setItem('localAstroRequests', JSON.stringify(allRequests));
                loadAdminData();
            }
        }
    </script>
</body>
</html>
