 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Form</title>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee+Spice&family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-container { background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .form-container h2 { text-align: center; margin-bottom: 20px; color: #333; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .form-group textarea { resize: vertical; height: 80px; }
        button { width: 100%; padding: 10px; background: #28a745; border: none; color: white; font-size: 16px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #218838; }
        #loading { display: none; text-align: center; margin-top: 10px; color: #007bff; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Submit Your Review</h2>
    <form id="reviewForm">
        <div class="form-group">
            <label for="name">Name *</label>
            <input type="text" id="name" required>
        </div>
        <div class="form-group">
            <label for="phone">Phone Number *</label>
            <input type="tel" id="phone" required pattern="[0-9]{10}" title="Enter a valid 10-digit phone number">
        </div>
        <div class="form-group">
            <label for="review">Review *</label>
            <textarea id="review" required></textarea>
        </div>
        <div class="form-group">
            <label for="image">Upload Image *</label>
            <input type="file" id="image" accept="image/*" required>
        </div>
        <button type="submit" id="submitBtn">Submit Review</button>
        <div id="loading">Submitting, please wait...</div>
    </form>
</div>

<script>
const scriptURL = 'https://script.google.com/macros/s/AKfycbw6lfA0LnoyvbxoNjqy5AmRsTx6YqnEM_eouLQxT4-tQ1xqYICNxzwJ7OKXi5ojmIK9/exec'; // Yahan apna Web App URL paste karein

document.getElementById('reviewForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const submitBtn = document.getElementById('submitBtn');
    const loading = document.getElementById('loading');
    
    const name = document.getElementById('name').value;
    const phone = document.getElementById('phone').value;
    const review = document.getElementById('review').value;
    const imageFile = document.getElementById('image').files[0];

    if (!imageFile) {
        alert('Please select an image!');
        return;
    }

    submitBtn.style.display = 'none';
    loading.style.display = 'block';

    const reader = new FileReader();
    reader.readAsDataURL(imageFile);
    reader.onload = function () {
        const base64Image = reader.result;

        const data = {
            name: name,
            phone: phone,
            review: review,
            image: base64Image,
            imageName: imageFile.name,
            imageType: imageFile.type
        };

        fetch(scriptURL, {
            method: 'POST',
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(result => {
            alert('Review submitted successfully!');
            document.getElementById('reviewForm').reset();
            submitBtn.style.display = 'block';
            loading.style.display = 'none';
        })
        .catch(error => {
            console.error('Error!', error.message);
            alert('Something went wrong. Please try again.');
            submitBtn.style.display = 'block';
            loading.style.display = 'none';
        });
    };
});
</script>

</body>
</html>
