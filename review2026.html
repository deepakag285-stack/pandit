<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review System</title>
            <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee+Spice&family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 40px; width: 100%; max-width: 900px; margin-top: 20px; }
        .form-container, .slider-container { background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; box-sizing: border-box; }
        h2 { text-align: center; color: #333; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .form-group textarea { resize: vertical; height: 80px; }
        button { width: 100%; padding: 12px; background: #007bff; border: none; color: white; font-size: 16px; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #0056b3; }
        #loading { display: none; text-align: center; margin-top: 10px; color: #007bff; font-weight: bold; }

        .slider-container { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; min-height: 320px; overflow: hidden; background: linear-gradient(135deg, #f8f9fa, #e9ecef); }
        .review-slide { display: none; text-align: center; width: 100%; animation: fadeIn 0.8s ease-in-out; }
        .review-slide.active { display: block; }
        
        .review-img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #007bff; margin-bottom: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .review-name { font-size: 18px; font-weight: bold; color: #333; margin-bottom: 5px; }
        .review-text { font-size: 14px; color: #666; font-style: italic; padding: 0 15px; line-height: 1.5; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .no-reviews { color: #888; text-align: center; font-style: italic; }
    </style>
</head>
<body>

    <h1>Customer Reviews Portal</h1>

    <div class="container">
        <!-- Form Section -->
        <div class="form-container">
            <h2>Submit Review</h2>
            <form id="reviewForm">
                <div class="form-group">
                    <label for="name">Name *</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <input type="tel" id="phone" required pattern="[0-9]{10}" title="Enter 10-digit number">
                </div>
                <div class="form-group">
                    <label for="review">Review *</label>
                    <textarea id="review" required></textarea>
                </div>
                <div class="form-group">
                    <label for="image">Upload Image *</label>
                    <input type="file" id="image" accept="image/*" required>
                </div>
                <button type="submit" id="submitBtn">Submit Review</button>
                <div id="loading">Submitting & Uploading...</div>
            </form>
        </div>

        <!-- Slider Section (Phone number hidden here) -->
        <div class="slider-container">
            <h2>Live Reviews</h2>
            <div id="sliderWrapper">
                <p class="no-reviews">Loading reviews...</p>
            </div>
        </div>
    </div>

<script>
const scriptURL = 'https://script.google.com/macros/s/AKfycbw6lfA0LnoyvbxoNjqy5AmRsTx6YqnEM_eouLQxT4-tQ1xqYICNxzwJ7OKXi5ojmIK9/exec'; // Yahan apna Web App URL paste karein
 
document.getElementById('reviewForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const submitBtn = document.getElementById('submitBtn');
    const loading = document.getElementById('loading');
    
    const name = document.getElementById('name').value;
    const phone = document.getElementById('phone').value;
    const review = document.getElementById('review').value;
    const imageFile = document.getElementById('image').files[0];

    if (!imageFile) {
        alert('Please select an image!');
        return;
    }

    submitBtn.style.display = 'none';
    loading.style.display = 'block';

    const reader = new FileReader();
    reader.readAsDataURL(imageFile);
    reader.onload = function () {
        const base64Image = reader.result;
        const data = {
            name: name,
            phone: phone,
            review: review,
            image: base64Image,
            imageName: imageFile.name,
            imageType: imageFile.type
        };

        fetch(scriptURL, {
            method: 'POST',
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(result => {
            alert('Review submitted successfully!');
            document.getElementById('reviewForm').reset();
            submitBtn.style.display = 'block';
            loading.style.display = 'none';
            fetchReviews();
        })
        .catch(error => {
            console.error('Error!', error.message);
            alert('Something went wrong. Please try again.');
            submitBtn.style.display = 'block';
            loading.style.display = 'none';
        });
    };
});

let currentSlide = 0;
let slideInterval;

function fetchReviews() {
    fetch(scriptURL)
    .then(response => response.json())
    .then(data => {
        const wrapper = document.getElementById('sliderWrapper');
        wrapper.innerHTML = '';

        if (data.length === 0) {
            wrapper.innerHTML = '<p class="no-reviews">No reviews yet!</p>';
            return;
        }

        data.forEach((item, index) => {
            const slide = document.createElement('div');
            slide.className = `review-slide ${index === 0 ? 'active' : ''}`;
            slide.innerHTML = `
                <img src="${item.image}" class="review-img" alt="User Image">
                <div class="review-name">${item.name}</div>
                <div class="review-text">"${item.review}"</div>
            `;
            wrapper.appendChild(slide);
        });

        startSlider();
    })
    .catch(error => {
        console.error('Error fetching reviews:', error);
        document.getElementById('sliderWrapper').innerHTML = '<p class="no-reviews">Failed to load reviews.</p>';
    });
}

function startSlider() {
    clearInterval(slideInterval);
    const slides = document.querySelectorAll('.review-slide');
    if (slides.length <= 1) return;

    slideInterval = setInterval(() => {
        slides[currentSlide].classList.remove('active');
        currentSlide = (currentSlide + 1) % slides.length;
        slides[currentSlide].classList.add('active');
    }, 4000);
}

window.onload = fetchReviews;
</script>

</body>
</html>
