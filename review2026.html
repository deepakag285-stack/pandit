<!DOCTYPE html>
<html>

<head>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee+Spice&family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


<meta name="viewport"
      content="width=device-width, initial-scale=1">

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f1f4f8;
}

.container {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 18px;
  box-shadow: 0 8px 30px rgba(0,0,0,.12);
}

h2 {
  text-align: center;
  margin-bottom: 25px;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 16px;
  margin-bottom: 7px;
}

input,
textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 15px;
}

textarea {
  height: 120px;
  resize: none;
}

input:focus,
textarea:focus {
  outline: none;
  border-color: #1a73e8;
}

.preview {
  display: none;
  width: 120px;
  height: 120px;
  object-fit: cover;
  margin: 15px auto;
  border-radius: 12px;
  border: 2px solid #ddd;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 22px;
  border: none;
  border-radius: 10px;
  background: #1a73e8;
  color: white;
  font-size: 17px;
  font-weight: bold;
}

button:disabled {
  background: #999;
}

#message {
  text-align: center;
  margin-top: 15px;
  font-weight: bold;
}

</style>

</head>

<body>

<div class="container">

<h2>⭐ Submit Your Review</h2>

<form id="reviewForm">

<label>Name *</label>

<input
  type="text"
  id="name"
  placeholder="Enter your name"
  required>


<label>Phone Number *</label>

<input
  type="tel"
  id="phone"
  placeholder="10 digit phone number"
  maxlength="10"
  required>


<label>Review *</label>

<textarea
  id="review"
  placeholder="Write your review..."
  required></textarea>


<label>Upload Image *</label>

<input
  type="file"
  id="image"
  accept="image/*"
  required>

<img
  id="preview"
  class="preview">


<button
  type="submit"
  id="submitBtn">

Submit Review

</button>

<div id="message"></div>

</form>

</div>


<script>

const imageInput =
  document.getElementById("image");

const preview =
  document.getElementById("preview");


/* Image Preview */

imageInput.addEventListener("change", function() {

  const file = this.files[0];

  if (!file) return;

  if (file.size > 5 * 1024 * 1024) {

    alert("Image must be less than 5 MB.");

    this.value = "";

    preview.style.display = "none";

    return;
  }

  const reader = new FileReader();

  reader.onload = function(e) {

    preview.src = e.target.result;

    preview.style.display = "block";

  };

  reader.readAsDataURL(file);

});


/* Submit */

document
.getElementById("reviewForm")
.addEventListener("submit", function(e) {

  e.preventDefault();

  const name =
    document.getElementById("name")
    .value.trim();

  const phone =
    document.getElementById("phone")
    .value.trim();

  const review =
    document.getElementById("review")
    .value.trim();

  const file =
    document.getElementById("image")
    .files[0];


  /* All fields compulsory */

  if (!name || !phone || !review || !file) {

    alert("Please fill all four fields.");

    return;
  }


  /* Phone validation */

  if (!/^[0-9]{10}$/.test(phone)) {

    alert("Enter a valid 10 digit phone number.");

    return;
  }


  const button =
    document.getElementById("submitBtn");

  const message =
    document.getElementById("message");


  button.disabled = true;

  button.innerText = "Uploading...";

  message.innerText = "";


  const reader = new FileReader();


  reader.onload = function() {

    const data = {

      name: name,

      phone: phone,

      review: review,

      image: reader.result

    };


    google.script.run

      .withSuccessHandler(function(result) {

        button.disabled = false;

        button.innerText =
          "Submit Review";


        if (result.success) {

          message.style.color = "green";

          message.innerText =
            "✓ Review submitted successfully!";

          document
            .getElementById("reviewForm")
            .reset();

          preview.src = "";

          preview.style.display = "none";

        } else {

          message.style.color = "red";

          message.innerText =
            "Error: " + result.message;

        }

      })

      .withFailureHandler(function(error) {

        button.disabled = false;

        button.innerText =
          "Submit Review";

        message.style.color = "red";

        message.innerText =
          "Something went wrong. Please try again.";

      })

      .submitReview(data);

  };


  reader.readAsDataURL(file);

});

</script>

</body>

</html>
